services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pastelink-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - app-vendor:/var/www/html/vendor
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:1.27-alpine
    container_name: pastelink-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: pastelink-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: pastelink
      MYSQL_USER: pastelink
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    container_name: pastelink-redis
    ports:
      - "6379:6379"

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pastelink-queue
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=120
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - queue-vendor:/var/www/html/vendor
    depends_on:
      - app
      - redis
      - mysql

volumes:
  mysql-data:
  app-vendor:
  queue-vendor:
