  #   command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=120
  #   working_dir: /var/www/html
  #   volumes:
  #     - ./:/var/www/html
  #     - app-vendor:/var/www/html/vendor
  #   networks:
  #     - sail
  #   depends_on:
  #     - app
