openapi: 3.1.0
info:
  title: PasteLink Core API
  version: 0.1.0
  description: Backend API for PasteLink file sharing and AI-powered content processing.
servers:
  - url: http://localhost:8080/api/v1
    description: Local Docker
  - url: http://localhost:8000/api/v1
    description: Local Artisan
tags:
  - name: System
    description: System and operational endpoints.
  - name: Auth
    description: Authentication endpoints.
paths:
  /health:
    get:
      tags:
        - System
      summary: Check API health
      operationId: getHealth
      responses:
        '200':
          description: API is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /me:
    get:
      tags:
        - Auth
      summary: Get authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  responses:
    Unauthenticated:
      description: The request is missing a valid authentication token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: OK
        data:
          type: object
          required:
            - status
            - service
          properties:
            status:
              type: string
              example: ok
            service:
              type: string
              example: paste-link-core
    UserResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: OK
        data:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Demo User
        email:
          type: string
          format: email
          example: demo@pastelink.app
    ErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Unauthenticated.
        code:
          type: string
          example: VALIDATION_ERROR
        errors:
          type: object
          additionalProperties: true
