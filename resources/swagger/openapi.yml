openapi: 3.1.0
info:
  title: PasteLink Core API
  version: 0.1.0
  description: Backend API for PasteLink file sharing and AI-powered content processing.
servers:
  - url: https://paste-link-core.onrender.com/api/v1
    description: Staging
  - url: http://localhost:8080/api/v1
    description: Local
tags:
  - name: System
    description: System and operational endpoints.
  - name: Auth
    description: Authentication endpoints.
  - name: Files
    description: File upload and file management endpoints.
  - name: Share Links
    description: Public file sharing endpoints.
paths:
  /health:
    get:
      tags:
        - System
      summary: Check API health
      operationId: getHealth
      responses:
        '200':
          description: API is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered and token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in a user
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User logged in and token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: The supplied credentials are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/google/redirect:
    get:
      tags:
        - Auth
      summary: Redirect to Google OAuth
      operationId: redirectToGoogleOAuth
      responses:
        '302':
          description: Redirects the client to the Google OAuth consent screen.
  /auth/google/callback:
    get:
      tags:
        - Auth
      summary: Handle Google OAuth callback
      operationId: handleGoogleOAuthCallback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code returned by Google.
      responses:
        '200':
          description: Google account linked or registered and token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          description: Google did not provide the required user email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Log out the current token
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current access token was revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /me:
    get:
      tags:
        - Auth
      summary: Get authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /files:
    get:
      tags:
        - Files
      summary: List authenticated user's files
      operationId: listFiles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Files owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags:
        - Files
      summary: Upload one or more files
      description: Uploading multiple files in one request creates a single ZIP archive and returns a direct download URL for that archive.
      operationId: uploadFiles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadFilesRequest'
      responses:
        '201':
          description: One or more files uploaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /files/{id}:
    get:
      tags:
        - Files
      summary: Get file details
      operationId: getFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: File details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FileNotFound'
    delete:
      tags:
        - Files
      summary: Delete a file
      operationId: deleteFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: File record and storage object were deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FileNotFound'
  /files/{id}/share-links:
    post:
      tags:
        - Share Links
      summary: Create or retrieve a public share link for a file
      operationId: createShareLink
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '201':
          description: Share link created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkResponse'
        '200':
          description: Existing share link returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ShareLinkNotFound'
  /share-links/{code}:
    get:
      tags:
        - Share Links
      summary: Get public share link metadata
      operationId: getShareLink
      parameters:
        - $ref: '#/components/parameters/ShareCode'
      responses:
        '200':
          description: Share link metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkResponse'
        '404':
          $ref: '#/components/responses/ShareLinkNotFound'
  /share-links/{id}:
    patch:
      tags:
        - Share Links
      summary: Update share link controls
      operationId: updateShareLink
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShareLinkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareLinkUpdateRequest'
      responses:
        '200':
          description: Share link updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ShareLinkNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Share Links
      summary: Delete share link
      operationId: deleteShareLink
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShareLinkId'
      responses:
        '200':
          description: Share link deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ShareLinkNotFound'
  /share-links/{id}/regenerate:
    post:
      tags:
        - Share Links
      summary: Regenerate share link code
      operationId: regenerateShareLink
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShareLinkId'
      responses:
        '200':
          description: Share link code regenerated and counters reset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ShareLinkNotFound'
  /share-links/{code}/verify-password:
    post:
      tags:
        - Share Links
      summary: Verify public share link password
      operationId: verifyShareLinkPassword
      parameters:
        - $ref: '#/components/parameters/ShareCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyShareLinkPasswordRequest'
      responses:
        '200':
          description: Password is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyShareLinkPasswordResponse'
        '403':
          $ref: '#/components/responses/ShareLinkPasswordError'
        '404':
          $ref: '#/components/responses/ShareLinkNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /f/{code}:
    get:
      tags:
        - Share Links
      summary: Get public file payload
      operationId: getPublicFile
      parameters:
        - $ref: '#/components/parameters/ShareCode'
      responses:
        '200':
          description: Public file payload for share page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFileResponse'
        '404':
          $ref: '#/components/responses/ShareLinkNotFound'
        '403':
          $ref: '#/components/responses/ShareLinkPasswordError'
  /f/{code}/download:
    get:
      tags:
        - Share Links
      summary: Download public shared file
      operationId: downloadPublicFile
      parameters:
        - $ref: '#/components/parameters/ShareCode'
      responses:
        '200':
          description: Binary file download.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/ShareLinkNotFound'
        '403':
          $ref: '#/components/responses/ShareLinkPasswordError'
  /f/{code}/qr-code:
    get:
      tags:
        - Share Links
      summary: Get QR code data for public share link
      operationId: getPublicFileQrCode
      parameters:
        - $ref: '#/components/parameters/ShareCode'
      responses:
        '200':
          description: QR code input data for frontend rendering.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkQrCodeResponse'
        '404':
          $ref: '#/components/responses/ShareLinkNotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    FileId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: File ID.
    ShareLinkId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Share link ID.
    ShareCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        minLength: 6
        maxLength: 16
      description: Public share code.
  responses:
    Unauthenticated:
      description: The request is missing a valid authentication token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: The request payload failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    FileNotFound:
      description: The file does not exist or is not owned by the authenticated user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ShareLinkNotFound:
      description: The share link does not exist or is not active.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ShareLinkPasswordError:
      description: The share link requires a password or the supplied password is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SuccessResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Logged out successfully.
    HealthResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: OK
        data:
          type: object
          required:
            - status
            - service
          properties:
            status:
              type: string
              example: ok
            service:
              type: string
              example: paste-link-core
    UserResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: OK
        data:
          $ref: '#/components/schemas/User'
    AuthTokenResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Logged in successfully.
        data:
          type: object
          required:
            - user
            - access_token
            - token_type
          properties:
            user:
              $ref: '#/components/schemas/User'
            access_token:
              type: string
              example: 1|plain-text-token
            token_type:
              type: string
              example: Bearer
    FileListResponse:
      type: object
      required:
        - success
        - message
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Files uploaded successfully.
        data:
          type: array
          items:
            $ref: '#/components/schemas/File'
        meta:
          type: object
          required:
            - count
          properties:
            count:
              type: integer
              description: Number of stored file records returned. Multiple source files are stored as one ZIP record.
              example: 2
            source_file_count:
              type: integer
              description: Number of original uploaded files in the request.
              example: 2
    FileResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: File retrieved successfully.
        data:
          $ref: '#/components/schemas/File'
    ShareLinkResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Share link created successfully.
        data:
          $ref: '#/components/schemas/ShareLink'
    PublicFileResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Public file retrieved successfully.
        data:
          type: object
          required:
            - share_link
            - file
          properties:
            share_link:
              $ref: '#/components/schemas/ShareLink'
            file:
              $ref: '#/components/schemas/PublicFile'
    ShareLinkQrCodeResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: QR code data retrieved successfully.
        data:
          type: object
          required:
            - code
            - qr_data
            - public_url
            - download_url
          properties:
            code:
              type: string
              example: A7X29K
            qr_data:
              type: string
              format: uri
              description: URL value that frontend can render into a QR code.
              example: https://paste-link-core.onrender.com/api/v1/f/A7X29K
            public_url:
              type: string
              format: uri
              example: https://paste-link-core.onrender.com/api/v1/f/A7X29K
            download_url:
              type: string
              format: uri
              example: https://paste-link-core.onrender.com/api/v1/f/A7X29K/download
    VerifyShareLinkPasswordResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Share link password verified successfully.
        data:
          type: object
          required:
            - verified
            - password_required
          properties:
            verified:
              type: boolean
              example: true
            password_required:
              type: boolean
              example: true
    ShareLinkUpdateRequest:
      type: object
      minProperties: 1
      properties:
        password:
          type:
            - string
            - 'null'
          minLength: 4
          maxLength: 255
          description: Set to null to remove the password.
          example: secret-password
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Future expiry timestamp. Set to null to remove expiry.
          example: 2026-07-13T10:30:00.000000Z
        is_active:
          type: boolean
          example: true
    VerifyShareLinkPasswordRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          example: secret-password
    UploadFilesRequest:
      type: object
      required:
        - files
      properties:
        files:
          type: array
          minItems: 1
          description: One or more files with a combined upload session limit of 300MB.
          items:
            type: string
            format: binary
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - password_confirmation
      properties:
        name:
          type: string
          example: Demo User
        email:
          type: string
          format: email
          example: demo@gmail.com
        google_avatar_url:
          type:
            - string
            - 'null'
          format: uri
          example: https://lh3.googleusercontent.com/avatar.png
        password:
          type: string
          format: password
          example: password
        password_confirmation:
          type: string
          format: password
          example: password
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: demo@gmail.com
        password:
          type: string
          format: password
          example: password
    User:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Demo User
        email:
          type: string
          format: email
          example: demo@gmail.com
    File:
      type: object
      required:
        - id
        - disk
        - path
        - full_path
        - download_url
        - original_name
        - stored_name
        - size
        - created_at
      properties:
        id:
          type: integer
          example: 1
        disk:
          type: string
          example: public_root
        path:
          type: string
          example: 20260702-document.pdf
        url:
          type:
            - string
            - 'null'
          format: uri
          example: http://localhost:8080/20260702-document.pdf
        full_path:
          type:
            - string
            - 'null'
          format: uri
          description: Absolute public URL that the frontend can use directly.
          example: https://paste-link-core.onrender.com/20260702-document.pdf
        download_url:
          type:
            - string
            - 'null'
          format: uri
          description: Direct URL that can be opened to download the stored file or generated ZIP archive.
          example: https://paste-link-core.onrender.com/20260702-files.zip
        original_name:
          type: string
          example: document.pdf
        stored_name:
          type: string
          example: 20260702-document.pdf
        mime_type:
          type:
            - string
            - 'null'
          example: application/pdf
        size:
          type: integer
          example: 131072
        created_at:
          type: string
          format: date-time
          example: 2026-06-29T10:30:00.000000Z
    PublicFile:
      type: object
      required:
        - id
        - original_name
        - stored_name
        - size
        - created_at
      properties:
        id:
          type: integer
          example: 1
        original_name:
          type: string
          example: document.pdf
        stored_name:
          type: string
          example: 20260702-document.pdf
        mime_type:
          type:
            - string
            - 'null'
          example: application/pdf
        size:
          type: integer
          example: 131072
        created_at:
          type: string
          format: date-time
          example: 2026-06-29T10:30:00.000000Z
    ShareLink:
      type: object
      required:
        - id
        - file_id
        - code
        - is_active
        - public_url
        - download_url
        - qr_code_url
        - created_at
        - file
      properties:
        id:
          type: integer
          example: 1
        file_id:
          type: integer
          example: 1
        code:
          type: string
          example: A7X29K
        is_active:
          type: boolean
          example: true
        password_required:
          type: boolean
          example: false
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          example: 2026-07-13T10:30:00.000000Z
        view_count:
          type: integer
          example: 12
        download_count:
          type: integer
          example: 3
        last_viewed_at:
          type:
            - string
            - 'null'
          format: date-time
          example: 2026-07-06T11:00:00.000000Z
        last_downloaded_at:
          type:
            - string
            - 'null'
          format: date-time
          example: 2026-07-06T11:05:00.000000Z
        public_url:
          type: string
          format: uri
          example: https://paste-link-core.onrender.com/api/v1/f/A7X29K
        download_url:
          type: string
          format: uri
          example: https://paste-link-core.onrender.com/api/v1/f/A7X29K/download
        qr_code_url:
          type: string
          format: uri
          example: https://paste-link-core.onrender.com/api/v1/f/A7X29K/qr-code
        created_at:
          type: string
          format: date-time
          example: 2026-07-06T10:30:00.000000Z
        file:
          $ref: '#/components/schemas/PublicFile'
    ErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Unauthenticated.
        code:
          type: string
          example: VALIDATION_ERROR
        errors:
          type: object
          additionalProperties: true
